name: v5.2 archive regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test tests/archive.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kanban-http.log 2>&1 &
          node tests/archive.browser.mjs
