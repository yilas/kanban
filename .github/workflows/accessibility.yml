name: v5.0 accessibility and settings

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-accessibility:
    name: Validate accessibility and settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run accessibility and settings regression tests
        run: node --test tests/accessibility.test.mjs
