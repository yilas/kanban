name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node scripts/check-js.mjs

      - name: Run tests
        run: node --test

      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check .github/workflows/ci.yml scripts/check-js.mjs tests/smoke.test.mjs .prettierrc.json
