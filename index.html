<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Kanban System v3.6 - Dracula Edition</title>
    <style>
      :root {
        /* Dracula Theme Palette */
        --bg: #282a36;
        --panel: #44475a;
        --border: #6272a4;
        --text: #f8f8f2;
        --accent: #bd93f9;
        --high: #ff5555;
        --mid: #ffb86c;
        --low: #50fa7b;
        --done: #6272a4;
        --cyan: #8be9fd;
        --pink: #ff79c6;
      }

      [data-theme="light"] {
        --bg: #f8f8f2;
        --panel: #e6e6e6;
        --border: #bd93f9;
        --text: #282a36;
        --accent: #6272a4;
      }

      body {
        font-family: "Fira Code", "Segoe UI", monospace;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        transition: background 0.3s;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 15px;
        margin-bottom: 20px;
      }

      .version-tag {
        font-size: 0.7rem;
        background: var(--pink);
        color: var(--bg);
        padding: 2px 6px;
        border-radius: 4px;
        vertical-align: middle;
      }

      /* Layout */
      .top-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }
      .input-box {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 15px;
        border-radius: 8px;
        flex: 2;
        display: flex;
        gap: 10px;
      }
      textarea {
        flex: 1;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px;
        font-family: inherit;
        resize: vertical;
      }

      .col-management {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 15px;
        border-radius: 8px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
      }

      .board {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        overflow-x: auto;
        padding-bottom: 30px;
        min-height: 75vh;
      }
      .main-col {
        flex: 1;
        min-width: 520px;
        background: var(--panel);
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .main-col-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        font-weight: bold;
        color: var(--cyan);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Grid setup */
      .sub-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .prio-pair {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .sub-col {
        min-height: 200px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        padding: 8px;
        border: 1px solid transparent;
        transition: 0.2s;
      }
      .sub-col.drag-over {
        border-color: var(--pink);
        background: rgba(255, 121, 198, 0.1);
      }
      .sub-col.is-done {
        opacity: 0.5;
        background: rgba(0, 0, 0, 0.4);
        border: 1px dashed var(--border);
      }

      .sub-title {
        font-size: 0.6rem;
        text-align: center;
        margin-bottom: 6px;
        color: var(--text);
        opacity: 0.7;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
      }

      .p1-border {
        border-top: 3px solid var(--high);
      }
      .p2-border {
        border-top: 3px solid var(--mid);
      }
      .p3-border {
        border-top: 3px solid var(--low);
      }

      /* Cards */
      .card {
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 6px;
        cursor: grab;
        font-size: 0.85rem;
        transition: transform 0.1s;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card-text {
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .card.done-task {
        border-style: dotted;
        opacity: 0.7;
      }

      /* Buttons & Inputs */
      .btn {
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid var(--border);
        padding: 6px 12px;
        background: var(--bg);
        color: var(--text);
        font-size: 0.8rem;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--bg);
        border: none;
        font-weight: bold;
      }
      .btn-primary:hover {
        filter: brightness(1.1);
      }
      .btn-danger {
        color: var(--high);
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1.1rem;
      }

      .search-input {
        padding: 8px 15px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        width: 200px;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--cyan);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <span style="font-weight: 900; font-size: 1.4rem; color: var(--accent)"
          >DRACULA_KANBAN</span
        >
        <span class="version-tag">v3.6</span>
      </div>
      <div style="display: flex; gap: 15px; align-items: center">
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="Rechercher (CTRL+F)..."
          oninput="render()"
        />
        <span
          onclick="toggleTheme()"
          style="cursor: pointer; font-size: 1.5rem"
          title="Switch Mode"
          >🌓</span
        >
        <button class="btn" onclick="exportBackup()">Export</button>
        <button class="btn" onclick="document.getElementById('imp').click()">
          Import
        </button>
        <input
          type="file"
          id="imp"
          style="display: none"
          onchange="importBackup(event)"
        />
      </div>
    </header>

    <div class="top-bar">
      <div class="input-box">
        <textarea
          id="taskText"
          rows="2"
          placeholder="Saisir un nouveau log... (Ctrl+Enter)"
        ></textarea>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <select id="taskPrio" class="btn">
            <option value="1" style="color: var(--high)">P1 - CRITICAL</option>
            <option value="2" selected style="color: var(--mid)">
              P2 - NORMAL
            </option>
            <option value="3" style="color: var(--low)">P3 - LOW</option>
          </select>
          <button class="btn-primary" style="padding: 12px" onclick="addTask()">
            EXECUTE
          </button>
        </div>
      </div>
      <div class="col-management">
        <div style="display: flex; gap: 8px">
          <input
            type="text"
            id="newColTitle"
            placeholder="Nom de la branche..."
            style="
              flex: 1;
              padding: 8px;
              border-radius: 4px;
              border: 1px solid var(--border);
              background: var(--bg);
              color: var(--text);
            "
          />
          <button class="btn" onclick="addColumn()">+ ADD</button>
        </div>
      </div>
    </div>

    <div class="board" id="board"></div>

    <script>
      const DB_KEY = "kanban_universal_db"; // Nom unique pour la db locale

      const defaultConfig = {
        tasks: [],
        columns: ["BACKLOG", "DEVELOPMENT", "DEPLOYED"],
        settings: { theme: "dark" },
      };

      let data = JSON.parse(localStorage.getItem(DB_KEY)) || defaultConfig;

      function save() {
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        applyTheme();
        render();
      }

      function applyTheme() {
        document.body.dataset.theme = data.settings.theme;
      }
      function toggleTheme() {
        data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
        save();
      }

      function addColumn() {
        const title = document
          .getElementById("newColTitle")
          .value.trim()
          .toUpperCase();
        if (title && !data.columns.includes(title)) {
          data.columns.push(title);
          document.getElementById("newColTitle").value = "";
          save();
        }
      }

      function removeColumn(title) {
        if (
          confirm(`WARNING: Remove column [${title}] and all associated logs?`)
        ) {
          data.columns = data.columns.filter((c) => c !== title);
          data.tasks = data.tasks.filter((t) => t.status !== title);
          save();
        }
      }

      function addTask() {
        const text = document.getElementById("taskText").value.trim();
        const prio = parseInt(document.getElementById("taskPrio").value);
        if (!text) return;
        data.tasks.push({
          id: Date.now(),
          text,
          prio,
          status: data.columns[0],
          completed: false,
        });
        document.getElementById("taskText").value = "";
        save();
      }

      // Drag and Drop implementation
      function onDragStart(e, id) {
        e.dataTransfer.setData("text/plain", id);
      }
      function onDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add("drag-over");
      }
      function onDragLeave(e) {
        e.currentTarget.classList.remove("drag-over");
      }
      function onDrop(e, status, prio, completed) {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain");
        data.tasks = data.tasks.map((t) =>
          t.id == id ? { ...t, status, prio: parseInt(prio), completed } : t,
        );
        save();
      }

      function render() {
        const search = document.getElementById("search").value.toLowerCase();
        const board = document.getElementById("board");
        board.innerHTML = "";

        data.columns.forEach((col) => {
          const colEl = document.createElement("div");
          colEl.className = "main-col";
          colEl.innerHTML = `
                <div class="main-col-header">
                    <span>${col}</span>
                    <button class="btn-danger" onclick="removeColumn('${col}')">×</button>
                </div>
                <div class="sub-grid">
                    ${[1, 2, 3]
                      .map(
                        (p) => `
                        <div class="prio-pair">
                            <div class="sub-title"><span style="color:var(--accent)">P${p}</span><span>ACTIVE</span></div>
                            <div class="sub-col p${p}-border" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${col}', ${p}, false)">
                                <div id="cont-${col}-${p}-active"></div>
                            </div>
                            <div class="sub-title"><span>COMPLETED</span></div>
                            <div class="sub-col is-done" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${col}', ${p}, true)">
                                <div id="cont-${col}-${p}-done"></div>
                            </div>
                        </div>
                    `,
                      )
                      .join("")}
                </div>`;
          board.appendChild(colEl);
        });

        data.tasks
          .filter((t) => t.text.toLowerCase().includes(search))
          .forEach((t) => {
            const suffix = t.completed ? "done" : "active";
            const cont = document.getElementById(
              `cont-${t.status}-${t.prio}-${suffix}`,
            );
            if (!cont) return;

            const card = document.createElement("div");
            card.className = `card ${t.completed ? "done-task" : ""}`;
            card.draggable = true;
            card.ondragstart = (e) => onDragStart(e, t.id);
            card.innerHTML = `
                <div class="card-text">${t.text}</div>
                <div style="display:flex; justify-content:space-between; font-size:0.55rem; opacity:0.6; margin-top:8px; font-family:monospace;">
                    <span style="color:var(--pink); cursor:pointer;" onclick="if(confirm('Delete log?')){data.tasks=data.tasks.filter(x=>x.id!=${t.id});save()}">[DELETE]</span>
                    <span>HEX_${t.id.toString(16).toUpperCase().slice(-4)}</span>
                </div>`;
            cont.appendChild(card);
          });
      }

      document.getElementById("taskText").addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") addTask();
      });

      function exportBackup() {
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `dracula_kanban_backup.json`;
        a.click();
      }

      function importBackup(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          data = JSON.parse(ev.target.result);
          save();
        };
        reader.readAsText(e.target.files[0]);
      }

      applyTheme();
      render();
    </script>
  </body>
</html>
