<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Terminal_Kanban_v1.3</title>
    <style>
        :root {
            --bg: #0d1117;
            --column-bg: #161b22;
            --card-bg: #0d1117;
            --text: #c9d1d9;
            --neon-blue: #58a6ff;
            --neon-green: #3fb950;
            --neon-orange: #d29922;
            --neon-red: #f85149;
            --border: #30363d;
        }

        body { 
            font-family: 'Cascadia Code', 'Courier New', monospace; 
            background: var(--bg); 
            color: var(--text);
            margin: 0; padding: 20px;
        }

        header {
            display: flex; justify-content: space-between;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px; margin-bottom: 30px;
        }

        .input-center {
            background: var(--column-bg);
            padding: 20px; border: 1px solid var(--neon-blue);
            border-radius: 4px; margin-bottom: 30px;
        }

        .input-row { display: flex; gap: 10px; align-items: flex-start; }
        .input-group { flex-grow: 1; }
        label { display: block; font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 5px; }

        textarea {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 10px; border-radius: 4px; resize: vertical;
            font-family: inherit; box-sizing: border-box;
        }

        select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 10px; border-radius: 4px; cursor: pointer; font-family: inherit;
        }

        .btn-exec {
            background: transparent; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 10px 20px; cursor: pointer;
            font-weight: bold; height: 100%;
        }
        .btn-exec:hover { background: var(--neon-green); color: var(--bg); }

        .board { display: flex; gap: 15px; overflow-x: auto; align-items: flex-start; }

        .column {
            background: var(--column-bg); border: 1px solid var(--border);
            border-radius: 4px; min-width: 320px; flex: 1;
        }

        .column-header {
            padding: 10px; background: rgba(255,255,255,0.05);
            border-bottom: 1px solid var(--border); font-weight: bold;
            display: flex; justify-content: space-between;
        }

        .list { padding: 10px; min-height: 100px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            margin-bottom: 10px; padding: 12px;
            border-left: 4px solid var(--border);
        }

        .card.p-3 { border-left-color: var(--neon-red); }
        .card.p-2 { border-left-color: var(--neon-orange); }
        .card.p-1 { border-left-color: var(--neon-green); }

        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        /* Sélecteur de priorité miniature sur la carte */
        .mini-prio { font-size: 0.7rem; padding: 2px; border: none; background: #21262d; color: #8b949e; }

        .card-text { 
            white-space: pre-wrap; cursor: pointer; padding: 5px; 
            border: 1px solid transparent; line-height: 1.4;
        }
        .card-text:hover { border-color: var(--border); background: rgba(255,255,255,0.02); }

        .edit-mode { width: 100%; min-height: 80px; margin-bottom: 10px; }

        .card-actions { margin-top: 10px; display: flex; gap: 5px; }
        .card-actions button {
            background: none; border: 1px solid var(--border); color: var(--text);
            font-size: 0.7rem; cursor: pointer; padding: 2px 5px;
        }
        .btn-del { color: var(--neon-red) !important; margin-left: auto; }
        .util-btn { background: none; border: 1px solid var(--border); color: var(--text); cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>

<header>
    <div>> root@kanban:~# <span id="clock"></span></div>
    <div>
        <button class="util-btn" onclick="exportJSON()">EXPORT.sh</button>
        <button class="util-btn" onclick="document.getElementById('imp').click()">IMPORT.sh</button>
        <input type="file" id="imp" style="display:none" onchange="importJSON(event)">
    </div>
</header>

<div class="input-center">
    <div class="input-row">
        <div class="input-group">
            <label>MULTI_LINE_INPUT (CTRL+ENTER to EXEC)</label>
            <textarea id="taskText" rows="3" placeholder="Saisissez votre note..."></textarea>
        </div>
        <div style="width: 160px;">
            <label>PRIORITY</label>
            <select id="taskPrio">
                <option value="3">P3 - CRITICAL</option>
                <option value="2" selected>P2 - NORMAL</option>
                <option value="1">P1 - LOW</option>
            </select>
        </div>
        <button class="btn-exec" style="height: 76px; margin-top: 21px;" onclick="createTask()">EXECUTE</button>
    </div>
</div>

<div class="board">
    <div class="column"><div class="column-header"><span>[TODO]</span><span id="count-todo">0</span></div><div id="list-todo" class="list"></div></div>
    <div class="column"><div class="column-header"><span>[PROCESSING]</span><span id="count-inprogress">0</span></div><div id="list-inprogress" class="list"></div></div>
    <div class="column"><div class="column-header"><span>[COMPLETED]</span><span id="count-done">0</span></div><div id="list-done" class="list"></div></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('geek-kanban-v1.3')) || [];
    let editingId = null;

    document.getElementById('taskText').addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') createTask();
    });

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toISOString().replace('T', ' ').slice(0, 19);
    }
    setInterval(updateClock, 1000);

    function createTask() {
        const el = document.getElementById('taskText');
        const text = el.value.trim();
        const prio = document.getElementById('taskPrio').value;
        if(!text) return;
        db.push({ id: Date.now(), text: text, prio: parseInt(prio), status: 'todo' });
        el.value = '';
        save();
    }

    function toggleEdit(id) {
        editingId = (editingId === id) ? null : id;
        render();
    }

    function updateText(id, newText) {
        db = db.map(t => t.id === id ? {...t, text: newText.trim()} : t);
        editingId = null;
        save();
    }

    function changePrio(id, newPrio) {
        db = db.map(t => t.id === id ? {...t, prio: parseInt(newPrio)} : t);
        save();
    }

    function move(id, status) {
        db = db.map(t => t.id === id ? {...t, status} : t);
        save();
    }

    function del(id) {
        if(confirm("CONFIRM RM?")) {
            db = db.filter(t => t.id !== id);
            save();
        }
    }

    function save() {
        localStorage.setItem('geek-kanban-v1.3', JSON.stringify(db));
        render();
    }

    function render() {
        ['todo', 'inprogress', 'done'].forEach(col => {
            const container = document.getElementById(`list-${col}`);
            const filtered = db.filter(t => t.status === col).sort((a,b) => b.prio - a.prio);
            document.getElementById(`count-${col}`).innerText = filtered.length;
            
            container.innerHTML = filtered.map(t => {
                const isEditing = editingId === t.id;
                return `
                <div class="card p-${t.prio}">
                    <div class="card-meta">
                        <span style="font-size:0.6rem; color:#444;">ID-${t.id}</span>
                        <select class="mini-prio" onchange="changePrio(${t.id}, this.value)">
                            <option value="3" ${t.prio === 3 ? 'selected' : ''}>P3</option>
                            <option value="2" ${t.prio === 2 ? 'selected' : ''}>P2</option>
                            <option value="1" ${t.prio === 1 ? 'selected' : ''}>P1</option>
                        </select>
                    </div>
                    ${isEditing ? 
                        `<textarea class="edit-area edit-mode" id="edit-${t.id}">${t.text}</textarea>
                         <button class="util-btn" onclick="updateText(${t.id}, document.getElementById('edit-${t.id}').value)">SAVE</button>` : 
                        `<div class="card-text" onclick="toggleEdit(${t.id})">${t.text}</div>`
                    }
                    <div class="card-actions">
                        ${col !== 'todo' ? `<button onclick="move(${t.id}, 'todo')">←</button>` : ''}
                        ${col !== 'inprogress' ? `<button onclick="move(${t.id}, 'inprogress')">EXE</button>` : ''}
                        ${col !== 'done' ? `<button onclick="move(${t.id}, 'done')">OK</button>` : ''}
                        <button class="btn-del" onclick="del(${t.id})">RM</button>
                    </div>
                </div>`;
            }).join('');
        });
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `kanban_backup.json`;
        a.click();
    }

    function importJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { db = JSON.parse(ev.target.result); save(); };
        reader.readAsText(e.target.files[0]);
    }

    render();
    updateClock();
</script>
</body>
</html>
