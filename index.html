<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Terminal_Kanban_v1.2</title>
    <style>
        :root {
            --bg: #0d1117;
            --column-bg: #161b22;
            --card-bg: #0d1117;
            --text: #c9d1d9;
            --neon-blue: #58a6ff;
            --neon-green: #3fb950;
            --neon-orange: #d29922;
            --neon-red: #f85149;
            --border: #30363d;
        }

        body { 
            font-family: 'Cascadia Code', 'Courier New', monospace; 
            background: var(--bg); 
            color: var(--text);
            margin: 0; padding: 20px;
        }

        header {
            display: flex; justify-content: space-between;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px; margin-bottom: 30px;
        }

        .input-center {
            background: var(--column-bg);
            padding: 20px; border: 1px solid var(--neon-blue);
            border-radius: 4px; margin-bottom: 30px;
            display: flex; gap: 10px; align-items: flex-end;
        }

        .input-group { flex-grow: 1; }
        label { display: block; font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 5px; }

        textarea, .edit-area {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 10px; border-radius: 4px; resize: none;
            font-family: inherit;
        }

        select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 10px; border-radius: 4px; cursor: pointer;
        }

        .btn-exec {
            background: transparent; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 10px 20px; cursor: pointer;
            font-weight: bold;
        }
        .btn-exec:hover { background: var(--neon-green); color: var(--bg); }

        .board { display: flex; gap: 15px; overflow-x: auto; align-items: flex-start; }

        .column {
            background: var(--column-bg); border: 1px solid var(--border);
            border-radius: 4px; min-width: 320px; flex: 1;
        }

        .column-header {
            padding: 10px; background: rgba(255,255,255,0.05);
            border-bottom: 1px solid var(--border); font-weight: bold;
            display: flex; justify-content: space-between;
        }

        .list { padding: 10px; min-height: 100px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            margin-bottom: 10px; padding: 12px;
            border-left: 4px solid var(--border);
        }

        .card.p-3 { border-left-color: var(--neon-red); }
        .card.p-2 { border-left-color: var(--neon-orange); }
        .card.p-1 { border-left-color: var(--neon-green); }

        .card-meta { font-size: 0.7rem; color: #8b949e; margin-bottom: 8px; }
        
        .card-text { cursor: pointer; padding: 5px; border-radius: 3px; }
        .card-text:hover { background: rgba(255,255,255,0.05); border: 1px dashed var(--border); }

        .card-actions { margin-top: 10px; display: flex; gap: 5px; }

        .card-actions button {
            background: none; border: 1px solid var(--border); color: var(--text);
            font-size: 0.7rem; cursor: pointer; padding: 2px 5px;
        }

        .btn-del { color: var(--neon-red) !important; margin-left: auto; }
        .util-btn { background: none; border: 1px solid var(--border); color: var(--text); cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>

<header>
    <div>> root@kanban:~# <span id="clock"></span></div>
    <div>
        <button class="util-btn" onclick="exportJSON()">EXPORT.sh</button>
        <button class="util-btn" onclick="document.getElementById('imp').click()">IMPORT.sh</button>
        <input type="file" id="imp" style="display:none" onchange="importJSON(event)">
    </div>
</header>

<div class="input-center">
    <div class="input-group">
        <label>INPUT_TEXT (CTRL+ENTER to EXEC)</label>
        <textarea id="taskText" rows="1" placeholder="Nouvelle tâche..."></textarea>
    </div>
    <div style="width: 160px;">
        <label>PRIORITY_LVL</label>
        <select id="taskPrio">
            <option value="3">P3 - CRITICAL</option>
            <option value="2" selected>P2 - NORMAL</option>
            <option value="1">P1 - LOW</option>
        </select>
    </div>
    <button class="btn-exec" onclick="createTask()">EXECUTE</button>
</div>

<div class="board">
    <div class="column">
        <div class="column-header"><span>[TODO]</span><span id="count-todo">0</span></div>
        <div id="list-todo" class="list"></div>
    </div>
    <div class="column">
        <div class="column-header"><span>[PROCESSING]</span><span id="count-inprogress">0</span></div>
        <div id="list-inprogress" class="list"></div>
    </div>
    <div class="column">
        <div class="column-header"><span>[COMPLETED]</span><span id="count-done">0</span></div>
        <div id="list-done" class="list"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('geek-kanban-v12')) || [];

    // Raccourci clavier pour le champ principal
    document.getElementById('taskText').addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') createTask();
    });

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toISOString().replace('T', ' ').slice(0, 19);
    }
    setInterval(updateClock, 1000);

    function createTask() {
        const el = document.getElementById('taskText');
        const text = el.value.trim();
        const prio = document.getElementById('taskPrio').value;
        if(!text) return;

        db.push({ id: Date.now(), text: text, prio: parseInt(prio), status: 'todo' });
        el.value = '';
        save();
    }

    function editTask(id) {
        const task = db.find(t => t.id === id);
        const newText = prompt("EDIT_TASK_CONTENT:", task.text);
        if (newText !== null && newText.trim() !== "") {
            task.text = newText.trim();
            save();
        }
    }

    function move(id, status) {
        db = db.map(t => t.id === id ? {...t, status} : t);
        save();
    }

    function del(id) {
        if(confirm("CONFIRM RM -RF?")) {
            db = db.filter(t => t.id !== id);
            save();
        }
    }

    function save() {
        localStorage.setItem('geek-kanban-v12', JSON.stringify(db));
        render();
    }

    function render() {
        const columns = ['todo', 'inprogress', 'done'];
        columns.forEach(col => {
            const container = document.getElementById(`list-${col}`);
            const filtered = db.filter(t => t.status === col).sort((a,b) => b.prio - a.prio);
            document.getElementById(`count-${col}`).innerText = filtered.length;
            
            container.innerHTML = filtered.map(t => `
                <div class="card p-${t.prio}">
                    <div class="card-meta">ID-${t.id} | P${t.prio}</div>
                    <div class="card-text" onclick="editTask(${t.id})">${t.text.replace(/\n/g, '<br>')}</div>
                    <div class="card-actions">
                        ${col !== 'todo' ? `<button onclick="move(${t.id}, 'todo')">←</button>` : ''}
                        ${col !== 'inprogress' ? `<button onclick="move(${t.id}, 'inprogress')">EXE</button>` : ''}
                        ${col !== 'done' ? `<button onclick="move(${t.id}, 'done')">OK</button>` : ''}
                        <button class="btn-del" onclick="del(${t.id})">RM</button>
                    </div>
                </div>
            `).join('');
        });
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `dump_${Date.now()}.json`;
        a.click();
    }

    function importJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                db = JSON.parse(ev.target.result);
                save();
            } catch(err) { alert("ERROR: INVALID_JSON"); }
        };
        reader.readAsText(e.target.files[0]);
    }

    render();
    updateClock();
</script>
</body>
</html>
