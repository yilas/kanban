<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Kanban System v3.5</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --border: #d0d7de;
        --text: #24292f;
        --accent: #0969da;
        --high: #cf222e;
        --mid: #d29922;
        --low: #1a7f37;
        --done: #8b949e;
      }
      [data-theme="dark"] {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --accent: #58a6ff;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        transition: background 0.3s;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
        margin-bottom: 20px;
      }

      .top-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }
      .input-box {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 15px;
        border-radius: 8px;
        flex: 2;
        display: flex;
        gap: 10px;
      }
      textarea {
        flex: 1;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px;
        font-family: inherit;
        resize: vertical;
      }

      .col-management {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 15px;
        border-radius: 8px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
      }

      .board {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        overflow-x: auto;
        padding-bottom: 30px;
        min-height: 75vh;
      }
      .main-col {
        flex: 1;
        min-width: 500px;
        background: var(--panel);
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 10px;
      }
      .main-col-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-weight: bold;
        font-size: 0.9rem;
        letter-spacing: 1px;
      }

      /* Grille : 3 priorités x 2 états (Actif / Terminé) */
      .sub-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .prio-pair {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .sub-col {
        min-height: 180px;
        background: rgba(0, 0, 0, 0.02);
        border-radius: 4px;
        padding: 5px;
        border: 1px dashed transparent;
      }
      .sub-col.drag-over {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.1);
      }
      .sub-col.is-done {
        opacity: 0.6;
        background: rgba(0, 0, 0, 0.05);
      }

      .sub-title {
        font-size: 0.6rem;
        text-align: center;
        margin-bottom: 4px;
        opacity: 0.5;
        font-weight: 900;
        display: flex;
        justify-content: space-between;
        padding: 0 5px;
      }

      .p1-border {
        border-top: 3px solid var(--high);
      }
      .p2-border {
        border-top: 3px solid var(--mid);
      }
      .p3-border {
        border-top: 3px solid var(--low);
      }

      .card {
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        cursor: grab;
        font-size: 0.8rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .card:active {
        cursor: grabbing;
      }
      .card-text {
        white-space: pre-wrap;
        line-height: 1.3;
      }
      .card.done-task {
        border-style: dashed;
        text-decoration: line-through;
      }

      .btn {
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid var(--border);
        padding: 6px 12px;
        background: var(--bg);
        color: var(--text);
        font-size: 0.8rem;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        border: none;
        font-weight: bold;
      }
      .btn-danger {
        color: var(--high);
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1rem;
      }

      .search-input {
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        width: 180px;
      }
    </style>
  </head>
  <body>
    <header>
      <div style="font-weight: 900; letter-spacing: -1px; font-size: 1.2rem">
        KANBAN_CORE_v3.5
      </div>
      <div style="display: flex; gap: 15px; align-items: center">
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="Filtrer..."
          oninput="render()"
        />
        <span onclick="toggleTheme()" style="cursor: pointer; font-size: 1.4rem"
          >🌓</span
        >
        <button class="btn" onclick="exportBackup()">Export</button>
        <button class="btn" onclick="document.getElementById('imp').click()">
          Import
        </button>
        <input
          type="file"
          id="imp"
          style="display: none"
          onchange="importBackup(event)"
        />
      </div>
    </header>

    <div class="top-bar">
      <div class="input-box">
        <textarea
          id="taskText"
          rows="2"
          placeholder="Nouvelle tâche... (Ctrl+Enter)"
        ></textarea>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <select id="taskPrio" class="btn">
            <option value="1">P1 - CRITIQUE</option>
            <option value="2" selected>P2 - MOYENNE</option>
            <option value="3">P3 - BASSE</option>
          </select>
          <button class="btn-primary" style="padding: 10px" onclick="addTask()">
            PUSH_TASK
          </button>
        </div>
      </div>
      <div class="col-management">
        <div style="display: flex; gap: 5px">
          <input
            type="text"
            id="newColTitle"
            placeholder="Nom colonne..."
            style="
              flex: 1;
              padding: 5px;
              border-radius: 4px;
              border: 1px solid var(--border);
              background: var(--bg);
              color: var(--text);
            "
          />
          <button class="btn" onclick="addColumn()">+ COL</button>
        </div>
      </div>
    </div>

    <div class="board" id="board"></div>

    <script>
      const DB_KEY = "kanban_universal_db";

      const defaultConfig = {
        tasks: [],
        columns: ["BACKLOG", "PRODUCTION", "ARCHIVES"],
        settings: { theme: "dark" },
      };

      let data = JSON.parse(localStorage.getItem(DB_KEY)) || defaultConfig;
      let currentlyEditing = null;

      function save() {
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        applyTheme();
        render();
      }

      function applyTheme() {
        document.body.dataset.theme = data.settings.theme;
      }
      function toggleTheme() {
        data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
        save();
      }

      function addColumn() {
        const title = document
          .getElementById("newColTitle")
          .value.trim()
          .toUpperCase();
        if (title && !data.columns.includes(title)) {
          data.columns.push(title);
          document.getElementById("newColTitle").value = "";
          save();
        }
      }

      function removeColumn(title) {
        if (confirm(`Supprimer ${title} ?`)) {
          data.columns = data.columns.filter((c) => c !== title);
          data.tasks = data.tasks.filter((t) => t.status !== title);
          save();
        }
      }

      function addTask() {
        const text = document.getElementById("taskText").value.trim();
        const prio = parseInt(document.getElementById("taskPrio").value);
        if (!text) return;
        data.tasks.push({
          id: Date.now(),
          text,
          prio,
          status: data.columns[0],
          completed: false,
        });
        document.getElementById("taskText").value = "";
        save();
      }

      function onDragStart(e, id) {
        e.dataTransfer.setData("text/plain", id);
      }
      function onDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add("drag-over");
      }
      function onDragLeave(e) {
        e.currentTarget.classList.remove("drag-over");
      }

      function onDrop(e, status, prio, completed) {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain");
        data.tasks = data.tasks.map((t) =>
          t.id == id ? { ...t, status, prio: parseInt(prio), completed } : t,
        );
        save();
      }

      function render() {
        const search = document.getElementById("search").value.toLowerCase();
        const board = document.getElementById("board");
        board.innerHTML = "";

        data.columns.forEach((col) => {
          const colEl = document.createElement("div");
          colEl.className = "main-col";
          colEl.innerHTML = `
                <div class="main-col-header">
                    <span>${col}</span>
                    <button class="btn-danger" onclick="removeColumn('${col}')">×</button>
                </div>
                <div class="sub-grid">
                    ${[1, 2, 3]
                      .map(
                        (p) => `
                        <div class="prio-pair">
                            <div class="sub-title"><span>P${p}</span><span>ACTIF</span></div>
                            <div class="sub-col p${p}-border" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${col}', ${p}, false)">
                                <div id="cont-${col}-${p}-active"></div>
                            </div>
                            <div class="sub-title"><span>DONE</span></div>
                            <div class="sub-col is-done" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${col}', ${p}, true)">
                                <div id="cont-${col}-${p}-done"></div>
                            </div>
                        </div>
                    `,
                      )
                      .join("")}
                </div>`;
          board.appendChild(colEl);
        });

        data.tasks
          .filter((t) => t.text.toLowerCase().includes(search))
          .forEach((t) => {
            const suffix = t.completed ? "done" : "active";
            const cont = document.getElementById(
              `cont-${t.status}-${t.prio}-${suffix}`,
            );
            if (!cont) return;

            const card = document.createElement("div");
            card.className = `card ${t.completed ? "done-task" : ""}`;
            card.draggable = true;
            card.ondragstart = (e) => onDragStart(e, t.id);
            card.innerHTML = `
                <div class="card-text">${t.text}</div>
                <div style="display:flex; justify-content:space-between; font-size:0.5rem; opacity:0.4; margin-top:5px;">
                    <span onclick="if(confirm('Supprimer?')){data.tasks=data.tasks.filter(x=>x.id!=${t.id});save()}" style="cursor:pointer; color:var(--high)">DEL</span>
                    <span>#${t.id.toString().slice(-4)}</span>
                </div>`;
            cont.appendChild(card);
          });
      }

      document.getElementById("taskText").addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") addTask();
      });

      function exportBackup() {
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `kanban_v35.json`;
        a.click();
      }

      function importBackup(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          data = JSON.parse(ev.target.result);
          save();
        };
        reader.readAsText(e.target.files[0]);
      }

      applyTheme();
      render();
    </script>
  </body>
</html>
