<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Kanban OS v3.0</title>
    <style>
        :root {
            --bg: #ffffff; --panel: #f6f8fa; --border: #d0d7de; --text: #24292f;
            --accent: #0969da; --high: #cf222e; --mid: #d29922; --low: #1a7f37;
        }
        [data-theme="dark"] {
            --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff;
        }

        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.2s; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        
        .top-bar { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-start; }
        .input-box { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; flex: 2; display: flex; gap: 10px; }
        textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-family: inherit; }
        
        .col-management { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; flex: 1; }

        .board { display: flex; gap: 20px; align-items: flex-start; overflow-x: auto; padding-bottom: 30px; }
        .main-col { flex: 1; min-width: 350px; background: var(--panel); border-radius: 8px; border: 1px solid var(--border); padding: 10px; position: relative; }
        .main-col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-rm-col { color: var(--high); cursor: pointer; border: none; background: none; font-weight: bold; }

        .sub-grid { display: flex; gap: 5px; }
        .sub-col { flex: 1; min-height: 200px; background: rgba(0,0,0,0.03); border-radius: 4px; padding: 5px; transition: 0.2s; }
        .sub-col.drag-over { background: var(--accent); opacity: 0.3; }
        .sub-title { font-size: 0.6rem; font-weight: bold; text-align: center; margin-bottom: 8px; opacity: 0.6; }

        /* Style des cartes */
        .card { 
            background: var(--bg); border: 1px solid var(--border); padding: 10px; margin-bottom: 10px; 
            border-radius: 4px; cursor: grab; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card:active { cursor: grabbing; }
        .card-text { white-space: pre-wrap; margin-bottom: 8px; }

        .btn { cursor: pointer; border-radius: 4px; border: 1px solid var(--border); padding: 5px 10px; background: var(--bg); color: var(--text); }
        .btn-primary { background: var(--accent); color: white; border: none; }
    </style>
</head>
<body data-theme="dark">

<header>
    <h1>Kanban OS v3.0</h1>
    <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="search" placeholder="Rechercher..." oninput="render()" style="padding:5px; border-radius:4px; border:1px solid var(--border); background:var(--panel); color:var(--text);">
        <span onclick="toggleTheme()" style="cursor:pointer; font-size:1.2rem;">🌓</span>
        <button class="btn" onclick="exportJSON()">Export</button>
        <button class="btn" onclick="document.getElementById('imp').click()">Import</button>
        <input type="file" id="imp" style="display:none" onchange="importJSON(event)">
    </div>
</header>

<div class="top-bar">
    <div class="input-box">
        <textarea id="taskText" placeholder="Nouvelle note... (Ctrl+Enter)"></textarea>
        <select id="taskPrio">
            <option value="3">P3 High</option>
            <option value="2" selected>P2 Mid</option>
            <option value="1">P1 Low</option>
        </select>
        <button class="btn-primary" onclick="addTask()">Ajouter</button>
    </div>
    <div class="col-management">
        <input type="text" id="newColTitle" placeholder="Nom de colonne..." style="width:70%; padding:5px;">
        <button class="btn" onclick="addColumn()">+ Col</button>
    </div>
</div>

<div class="board" id="board"></div>

<script>
    let tasks = JSON.parse(localStorage.getItem('k3-tasks')) || [];
    let cols = JSON.parse(localStorage.getItem('k3-cols')) || ["À FAIRE", "EN COURS", "TERMINÉ"];

    function toggleTheme() {
        const b = document.body;
        b.dataset.theme = b.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('k3-theme', b.dataset.theme);
    }
    document.body.dataset.theme = localStorage.getItem('k3-theme') || 'dark';

    function addColumn() {
        const title = document.getElementById('newColTitle').value.trim().toUpperCase();
        if(title && !cols.includes(title)) {
            cols.push(title);
            document.getElementById('newColTitle').value = '';
            save();
        }
    }

    function removeColumn(title) {
        if(confirm(`Supprimer la colonne ${title} ?`)) {
            cols = cols.filter(c => c !== title);
            tasks = tasks.filter(t => t.status !== title);
            save();
        }
    }

    function addTask() {
        const text = document.getElementById('taskText').value.trim();
        const prio = parseInt(document.getElementById('taskPrio').value);
        if(!text) return;
        tasks.push({ id: Date.now(), text, prio, status: cols[0] });
        document.getElementById('taskText').value = '';
        save();
    }

    function save() {
        localStorage.setItem('k3-tasks', JSON.stringify(tasks));
        localStorage.setItem('k3-cols', JSON.stringify(cols));
        render();
    }

    // --- DRAG & DROP LOGIC ---
    function onDragStart(e, id) { e.dataTransfer.setData('text/plain', id); }
    function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function onDrop(e, status, prio) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        tasks = tasks.map(t => t.id == id ? {...t, status, prio: parseInt(prio)} : t);
        save();
    }

    function render() {
        const search = document.getElementById('search').value.toLowerCase();
        const board = document.getElementById('board');
        board.innerHTML = '';

        cols.forEach(col => {
            const colEl = document.createElement('div');
            colEl.className = 'main-col';
            colEl.innerHTML = `
                <div class="main-col-header">
                    <strong>${col}</strong>
                    <button class="btn-rm-col" onclick="removeColumn('${col}')">×</button>
                </div>
                <div class="sub-grid">
                    ${[3,2,1].map(p => `
                        <div class="sub-col" 
                             ondragover="onDragOver(event)" 
                             ondragleave="onDragLeave(event)" 
                             ondrop="onDrop(event, '${col}', ${p})">
                            <div class="sub-title">P${p}</div>
                            <div id="cont-${col}-${p}"></div>
                        </div>
                    `).join('')}
                </div>
            `;
            board.appendChild(colEl);
        });

        tasks.filter(t => t.text.toLowerCase().includes(search)).forEach(t => {
            const cont = document.getElementById(`cont-${t.status}-${t.prio}`);
            if(!cont) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.ondragstart = (e) => onDragStart(e, t.id);
            card.innerHTML = `
                <div class="card-text">${t.text}</div>
                <div style="display:flex; justify-content:space-between; font-size:0.6rem; opacity:0.5;">
                    <span>ID-${t.id}</span>
                    <span style="color:red; cursor:pointer;" onclick="tasks=tasks.filter(x=>x.id!=${t.id});save()">SUPPR.</span>
                </div>
            `;
            cont.appendChild(card);
        });
    }

    document.getElementById('taskText').addEventListener('keydown', e => {
        if((e.ctrlKey || e.metaKey) && e.key === 'Enter') addTask();
    });

    function exportJSON() {
        const data = { tasks, cols, theme: document.body.dataset.theme };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'kanban_v3_backup.json';
        a.click();
    }

    function importJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const data = JSON.parse(ev.target.result);
            tasks = data.tasks || [];
            cols = data.cols || cols;
            save();
        };
        reader.readAsText(e.target.files[0]);
    }

    render();
</script>
</body>
</html>
